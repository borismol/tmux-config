# ============================================================
#  Powerline-style status bar  (no plugins required)
#  Requires a Powerline/Nerd Font in your terminal for glyphs.
# ============================================================

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -as terminal-features ',*:RGB'      # true colour on any terminal
set -as terminal-features ',*:extkeys'  # enhanced keys (e.g. C-Tab) where the terminal supports it

# ---- behaviour --------------------------------------------------------------
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g monitor-activity on
set -g visual-activity off
set -sg escape-time 10        # fast Esc for vim
set -g focus-events on        # FocusIn/FocusOut for vim autoread etc.
set -g history-limit 50000    # default is only 2000
set -g mouse on
set -g detach-on-destroy off  # killing a session switches to another instead of detaching

# ---- palette (edit these to retheme) --------------------------------------
%hidden C_BG="colour234"        # bar background
%hidden C_FG="colour245"        # dim text
%hidden C_ACCENT="colour39"     # primary accent (blue)
%hidden C_ACCENT_FG="colour16"  # text on accent
%hidden C_DIM="colour238"       # secondary block
%hidden C_DIM_FG="colour250"
%hidden C_ALERT="colour203"     # activity / bell

# separator glyphs (Powerline)
%hidden SEP_R=""               # filled right-pointing
%hidden SEP_R_THIN=""          # thin right-pointing
%hidden SEP_L=""               # filled left-pointing
%hidden SEP_L_THIN=""          # thin left-pointing

# ---- base styles ----------------------------------------------------------
set -g status-style "bg=$C_BG,fg=$C_FG"
set -g pane-border-style "fg=$C_DIM"
set -g pane-active-border-style "fg=$C_ACCENT"

# ---- pane-number overlay (prefix + q) -------------------------------
set -g display-panes-time 2000
set -g display-panes-colour        "colour238"
set -g display-panes-active-colour "colour39"

# ---- pane borders --------------------------------------------------
set -g pane-border-lines heavy
set -g pane-border-indicators colour
# show the pane title bar only when a window has >1 pane
set-hook -g window-layout-changed 'setw -F pane-border-status "#{?#{==:#{window_panes},1},off,top}"'
set-hook -g after-new-window      'setw -F pane-border-status "#{?#{==:#{window_panes},1},off,top}"'
set -g pane-border-status off
set -g pane-border-format " #[bold]#P#[nobold] #{pane_current_command}#{?pane_active, [active],} "

set -g message-style "bg=$C_ACCENT,fg=$C_ACCENT_FG"
set -g message-command-style "bg=$C_DIM,fg=$C_DIM_FG"
set -g mode-style "bg=$C_ACCENT,fg=$C_ACCENT_FG"

# ---- left: session name + prefix/zoom indicators -----------------------
set -g status-left-length 60
set -g status-left "\
#[bg=$C_ACCENT,fg=$C_ACCENT_FG,bold] #S \
#[bg=#{?client_prefix,$C_ALERT,$C_DIM},fg=$C_ACCENT]$SEP_R\
#[bg=#{?client_prefix,$C_ALERT,$C_DIM},fg=$C_DIM_FG] #{?client_prefix,PREFIX,#{?window_zoomed_flag,ZOOM,tmux}} \
#[bg=$C_BG,fg=#{?client_prefix,$C_ALERT,$C_DIM}]$SEP_R "

# ---- windows ------------------------------------------------------------
set -g window-status-separator " "

# tmux's default for these is "reverse", which inverts flagged tabs
# (grey text, red bg). Our format already draws · / ! in red itself.
set -g window-status-activity-style "fg=$C_FG,bg=$C_BG"
set -g window-status-bell-style "fg=$C_FG,bg=$C_BG"

set -g window-status-format "#[fg=$C_DIM,bg=$C_BG]#[fg=$C_DIM_FG,bg=$C_DIM] #I:#W#[fg=$C_ALERT]#{?window_bell_flag, !,}#{?window_activity_flag, ·,}#[fg=$C_DIM_FG,bg=$C_DIM] #[fg=$C_DIM,bg=$C_BG]"

set -g window-status-current-format "#[fg=$C_ACCENT,bg=$C_BG]#[fg=$C_ACCENT_FG,bg=$C_ACCENT,bold] #I:#W#{?window_zoomed_flag, ,}#[fg=$C_ALERT]#{?window_bell_flag, !,}#{?window_activity_flag, ·,}#[fg=$C_ACCENT_FG,bg=$C_ACCENT] #[fg=$C_ACCENT,bg=$C_BG]"

# ---- right: path - git branch - host - clock -------------------------
set -g status-right-length 120
set -g status-right "\
#[fg=$C_DIM]$SEP_L#[bg=$C_DIM,fg=$C_DIM_FG] #{b:pane_current_path} \
#[fg=$C_ACCENT,bg=$C_DIM]$SEP_L#[bg=$C_ACCENT,fg=$C_ACCENT_FG]  #(cd '#{pane_current_path}' && git rev-parse --abbrev-ref HEAD 2>/dev/null || echo -) \
#[fg=$C_DIM_FG,bg=$C_ACCENT]$SEP_L#[bg=$C_DIM_FG,fg=$C_BG,bold] #h \
#[fg=$C_ACCENT,bg=$C_DIM_FG]$SEP_L#[bg=$C_ACCENT,fg=$C_ACCENT_FG,bold] %H:%M "

# ---- reload -----------------------------------------------------------
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# ---- windows / panes: open in the current directory -------------------
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"

# ---- last-window / last-pane -----------------------------------------
bind Tab   last-window     # prefix + Tab  -> toggle to previously used window
bind \\     last-pane       # prefix + \    -> toggle to previously used pane

# ---- vim-style pane navigation (arrow keys still work) ---------------
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ---- repeatable pane resizing ----------------------------------------
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ---- scratch popup terminal (replaces the default clock on t) --------
bind t display-popup -E -w 80% -h 80% -d "#{pane_current_path}" "tmux new-session -A -s scratch"

# ---- copy mode: vi keys + OSC 52 clipboard ---------------------------
set -s set-clipboard on          # terminals supporting OSC 52 (incl. over SSH) take the copy
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
# mouse release in copy mode: copy but KEEP the selection visible.
# tmux consults the copy-mode table for mouse events while in copy mode,
# so this must be bound here (root bindings are shadowed; the built-in
# default copy-pipe-and-cancel exits copy mode and hides the selection)
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-no-clear
bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-no-clear

# ---- copy from apps that grab the mouse (opencode, vim, ...) ----------
# plain drags go to the app (mouse_any_flag); hold Alt (or Shift) while
# dragging to force tmux copy mode; release copies via OSC 52
bind -n M-MouseDown1Pane select-pane -t=
bind -n M-MouseDrag1Pane if-shell -F '#{pane_in_mode}' 'select-pane -t=; send-keys -X begin-selection' 'copy-mode -M'
bind -n M-MouseDragEnd1Pane if-shell -F '#{pane_in_mode}' 'send-keys -X copy-pipe-no-clear'
bind -n S-MouseDown1Pane select-pane -t=
bind -n S-MouseDrag1Pane if-shell -F '#{pane_in_mode}' 'select-pane -t=; send-keys -X begin-selection' 'copy-mode -M'
bind -n S-MouseDragEnd1Pane if-shell -F '#{pane_in_mode}' 'send-keys -X copy-pipe-no-clear'

# kill every pane in the window except the active one
bind X confirm-before -p "kill other panes? (y/n)" "kill-pane -a"

# keep manually-set window names (no auto-rename)
set -g allow-rename off
set -g automatic-rename off
